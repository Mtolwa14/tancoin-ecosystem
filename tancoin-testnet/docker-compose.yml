
services:
  validator1:
    image: hyperledger/besu:latest
    container_name: tancoin-validator1
    restart: unless-stopped
    volumes:
      - ./node1:/data
    command:
      - --data-path=/data
      - --genesis-file=/data/genesis.json
      - --network-id=202611
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL
      - --sync-mode=FULL
    ports:
      - "8545:8545"

  validator2:
    image: hyperledger/besu:latest
    container_name: tancoin-validator2
    restart: unless-stopped
    volumes:
      - ./node2:/data
    command:
      - --data-path=/data
      - --genesis-file=/data/genesis.json
      - --network-id=202611
    ports:
      - "8546:8545"

  validator3:
    image: hyperledger/besu:latest
    container_name: tancoin-validator3
